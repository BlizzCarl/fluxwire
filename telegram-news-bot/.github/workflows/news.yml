name: news

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          TRANSLATE_TO: ru

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: news-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/news.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
