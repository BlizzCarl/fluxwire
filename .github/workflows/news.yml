name: news

# Бота каждые 10 минут запускает внешний будильник cron-job.org (см. README).
# Своего расписания GitHub здесь нет специально: иначе бот запускался бы дважды.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что сделать"
        type: choice
        default: post
        options:
          - post        # обычный запуск: один пост (так запускает cron-job.org)
          - digest      # опубликовать дайджест прямо сейчас, для проверки
          - test-alert  # прислать пробное предупреждение в личку

permissions:
  contents: read
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

defaults:
  run:
    working-directory: telegram-news-bot

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram-news-bot/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: telegram-news-bot/state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: telegram-news-bot/.cache/fastembed
          key: fastembed-paraphrase-multilingual-MiniLM-L12-v2

      - name: Run bot
        run: |
          case "$MODE" in
            digest) python bot.py --digest ;;
            test-alert) python bot.py --test-alert ;;
            *) python bot.py ;;
          esac
        env:
          MODE: ${{ inputs.mode }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          TRANSLATE_TO: ru
          PYTHONUNBUFFERED: "1"
          MIN_SCORE: "8"
          DIGEST_HOUR: "21"
          DIGEST_TZ: Europe/Moscow

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram-news-bot/state.json
          key: news-state-${{ github.run_id }}-${{ github.run_attempt }}
